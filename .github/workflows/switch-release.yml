# Switch release: publish a finished Switch build as a GitHub release, with
# an NSP forwarder per edition. Started by hand (Actions > Switch release >
# Run workflow): the latest successful "Switch build", or the one whose run
# ID is given.
#
#   approve   GitHub runner, "release" environment: with required reviewers
#             set on it (Settings > Environments > release), the release
#             waits here for approval. Then it checks the build, the version,
#             the notes and the NROs.
#   nsp       your self-hosted runner (label mcdub3-keys): builds the NSP
#             forwarders with the console keys on that machine (MC3_KEYS in
#             the runner's .env). The keys are never uploaded or stored on
#             GitHub; only the finished NSPs are.
#   publish   GitHub runner: tags v<version> on the build's commit and
#             publishes NROs and NSPs together, or nothing.
#
# The release notes are the "## v<version>" section of RELEASE_NOTES.md, as
# committed in the build's commit; the version is switch/app.env's
# APP_VERSION at that commit.
name: Switch release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID of the Switch build to release (empty: the latest successful one)"
        required: false
        default: ""
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: true

permissions:
  contents: write     # tag and release
  actions: read       # the build's artifacts

concurrency:
  group: switch-release
  cancel-in-progress: false

jobs:
  approve:
    name: Approve and check
    runs-on: ubuntu-24.04
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.build_run_id }}
    outputs:
      sha: ${{ steps.build.outputs.sha }}
      tag: ${{ steps.notes.outputs.tag }}
      version: ${{ steps.notes.outputs.version }}
    steps:
      - name: The build
        id: build
        run: |
          if [ -z "$RUN_ID" ]; then
            # The latest successful Switch build.
            RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/switch-build.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
            [ -n "$RUN_ID" ] || { echo "no successful Switch build yet: run Switch build first"; exit 1; }
            echo "No run ID given: the latest successful Switch build, $RUN_ID"
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "build_run_id must be a number"; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          read -r name conclusion sha < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            --jq '[.name, .conclusion, .head_sha] | @tsv')
          [ "$name" = "Switch build" ] || { echo "run $RUN_ID is '$name', not a Switch build"; exit 1; }
          [ "$conclusion" = "success" ] || { echo "run $RUN_ID did not succeed ($conclusion)"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Releasing Switch build $RUN_ID at $sha"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.build.outputs.sha }}

      - name: Version and notes
        id: notes
        run: |
          source switch/app.env
          tag="v$APP_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists already: raise APP_VERSION in switch/app.env"; exit 1
          fi
          # The section of RELEASE_NOTES.md from "## v<version>" to the next "## ".
          awk -v h="## $tag" '
            $0 == h || index($0, h " ") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }' RELEASE_NOTES.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "RELEASE_NOTES.md has no notes under '## $tag' in ${{ steps.build.outputs.sha }}"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: mcdub3-nx-*
          path: ${{ runner.temp }}/build

      - name: Check the NROs
        run: |
          cd "$RUNNER_TEMP/build"
          ls -R
          n=0
          for info in */*.buildinfo; do
            v=$(sed -n 's/^version=//p' "$info")
            [ "$v" = "${{ steps.notes.outputs.version }}" ] \
              || { echo "$info is version $v, not ${{ steps.notes.outputs.version }}"; exit 1; }
            nro="${info%.buildinfo}.nro"
            want=$(sed -n 's/^nro_sha256=//p' "$info")
            echo "$want  $nro" | sha256sum -c -
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "no NRO in build ${{ steps.build.outputs.run_id }}"; exit 1; }
          cp "$RUNNER_TEMP/notes.md" ./notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-checked
          path: ${{ runner.temp }}/build/
          retention-days: 7

  nsp:
    name: NSP forwarders
    needs: approve
    runs-on: [self-hosted, mcdub3-keys]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.approve.outputs.sha }}
          clean: true

      - name: Build
        env:
          MC3_WORK: ${{ github.workspace }}/../mcdub3-work-nsp
        run: |
          : "${MC3_KEYS:?the runner needs MC3_KEYS (path to prod.keys) in its .env (CONTRIBUTING.md, Releases)}"
          test -f "$MC3_KEYS" || { echo "no keys at MC3_KEYS"; exit 1; }
          make nsp KEYS="$MC3_KEYS"
          mkdir -p "$RUNNER_TEMP/nsp"
          cp "$MC3_WORK"/nsp/mcdub3-nx-*-"${{ needs.approve.outputs.version }}".nsp "$RUNNER_TEMP/nsp/"
          ls -l "$RUNNER_TEMP/nsp"

      - uses: actions/upload-artifact@v4
        with:
          name: release-nsp
          path: ${{ runner.temp }}/nsp/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish
    needs: [approve, nsp]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.approve.outputs.tag }}
      SHA: ${{ needs.approve.outputs.sha }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-checked
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: release-nsp
          path: nsp

      - name: Publish
        run: |
          {
            desc=$(cat build/*/description.txt 2>/dev/null | sed '/^$/d' | sort -u)
            [ -n "$desc" ] && printf '%s\n\n' "$desc"
            cat build/notes.md
            echo
            echo "---"
            echo
            echo "| File | Edition | SHA-256 |"
            echo "|---|---|---|"
            for info in build/*/*.buildinfo; do
              f=$(basename "${info%.buildinfo}.nro")
              echo "| \`$f\` | $(sed -n 's/^edition=//p' "$info") | \`$(sed -n 's/^nro_sha256=//p' "$info")\` |"
            done
            for f in nsp/*.nsp; do
              echo "| \`$(basename "$f")\` | forwarder | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
            echo
            echo "Build $(sed -n 's/^build=//p' build/*/*.buildinfo | head -1), commit $SHA."
          } > body.md
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" build/*/*.nro nsp/*.nsp \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "mcdub3-nx $TAG" --notes-file body.md "${flags[@]}"
          echo "published $TAG" >> "$GITHUB_STEP_SUMMARY"
